name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check subdomain + live test
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-maplestreamtv
        run: |
          mkdir -p .debug
          echo "=== subdomain status ===" > .debug/check.txt
          curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" >> .debug/check.txt
          echo "" >> .debug/check.txt
          echo "=== live GET ===" >> .debug/check.txt
          curl -s "https://iptv-trial-maplestreamtv.medmaar.workers.dev/" >> .debug/check.txt
          cat .debug/check.txt

      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add .debug/check.txt
          git commit -m "debug: check" || true
          git push || true
