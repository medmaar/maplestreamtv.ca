name: Test Worker

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test worker and post results to gist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://iptv-trial-maplestreamtv.medmaar.workers.dev" \
            -H "Content-Type: application/json" \
            -d '{"name":"Test User","email":"test-diag@maplestreamtv.ca","device":"Firestick","whatsapp":"+11234567890","notes":"diagnostic test","country":"Canada"}')
          
          DEBUG=$(curl -s "https://iptv-trial-maplestreamtv.medmaar.workers.dev/?debug")
          
          GIST_CONTENT="POST_RESPONSE: $RESPONSE\nDEBUG_RESPONSE: $DEBUG"
          echo "POST: $RESPONSE"
          echo "DEBUG: $DEBUG"
          
          curl -s -X POST "https://api.github.com/gists" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"public\":false,\"description\":\"Worker test results\",\"files\":{\"results.txt\":{\"content\":\"POST: $RESPONSE\nDEBUG: $DEBUG\"}}}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('GIST_ID=' + d.get('id',''))"
