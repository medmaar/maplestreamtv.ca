name: Test Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test worker
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://iptv-trial-maplestreamtv.medmaar.workers.dev" \
            -H "Content-Type: application/json" \
            -d '{"name":"Test User","email":"test-diag@maplestreamtv.ca","device":"Firestick","whatsapp":"+11234567890","notes":"diagnostic test","country":"Canada"}')
          
          DEBUG=$(curl -s "https://iptv-trial-maplestreamtv.medmaar.workers.dev/?debug")
          
          echo "POST_RESULT=${RESPONSE}" >> $GITHUB_OUTPUT
          echo "POST: $RESPONSE"
          echo "DEBUG: $DEBUG"
          printf "POST: %s\nDEBUG: %s\n" "$RESPONSE" "$DEBUG" > worker-test-result.txt

      - name: Push results to test-results branch
        run: |
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git checkout -B test-results
          git add worker-test-result.txt
          git commit -m "test results"
          git push origin test-results --force
