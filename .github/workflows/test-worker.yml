name: Test Worker
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run probe
        run: |
          sleep 5
          PROBE=$(curl -s "https://iptv-trial-maplestreamtv.medmaar.workers.dev/?probe")
          echo "PROBE: $PROBE"
          echo "$PROBE" > worker-test-result.txt
      - name: Push results
        run: |
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git checkout -B test-results
          git add worker-test-result.txt
          git commit -m "probe results" --allow-empty
          git push origin test-results --force
