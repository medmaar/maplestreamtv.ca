name: Test Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe + test worker
        run: |
          echo "=== PROBE valid API params ==="
          PROBE=$(curl -s "https://iptv-trial-maplestreamtv.medmaar.workers.dev/?probe")
          echo "PROBE: $PROBE"
          
          echo "=== POST test trial ==="
          RESPONSE=$(curl -s -X POST \
            "https://iptv-trial-maplestreamtv.medmaar.workers.dev" \
            -H "Content-Type: application/json" \
            -d '{"name":"Test User","email":"test-diag@maplestreamtv.ca","device":"Firestick","whatsapp":"+11234567890","notes":"diagnostic test","country":"Canada"}')
          echo "POST: $RESPONSE"
          
          echo "PROBE: $PROBE" > worker-test-result.txt
          echo "POST: $RESPONSE" >> worker-test-result.txt

      - name: Push results to test-results branch
        run: |
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git checkout -B test-results
          git add worker-test-result.txt
          git commit -m "test results" --allow-empty
          git push origin test-results --force
